name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
          - '1.12'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # CytoZoo and MatrixFreeOperators are unregistered, so a bare `instantiate` cannot
      # resolve them. Same repos the README's install block points at.
      - name: Add unregistered dependencies
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.add([
              PackageSpec(url="https://github.com/RallypointOne/MatrixFreeOperators.jl"),
              PackageSpec(url="https://github.com/DerangedIons/CytoZoo.jl"),
          ])
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      # Both environments have to resolve the unregistered deps: the root project, built
      # by julia-buildpkg, and docs/, which julia-docdeploy instantiates separately.
      - name: Add unregistered dependencies
        shell: julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.add([
              PackageSpec(url="https://github.com/RallypointOne/MatrixFreeOperators.jl"),
              PackageSpec(url="https://github.com/DerangedIons/CytoZoo.jl"),
          ])
      - uses: julia-actions/julia-buildpkg@v1
      # Lightning is itself a dep of the docs project and is also unregistered, so all
      # three have to enter in one resolve — adding just the two upstreams fails with
      # `expected package Lightning [076478a6] to be registered`.
      - name: Add unregistered dependencies to the docs environment
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.develop([
              PackageSpec(url="https://github.com/RallypointOne/MatrixFreeOperators.jl"),
              PackageSpec(url="https://github.com/DerangedIons/CytoZoo.jl"),
              PackageSpec(path=pwd()),
          ])
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using Lightning
          DocMeta.setdocmeta!(Lightning, :DocTestSetup, :(using Lightning); recursive=true)
          doctest(Lightning)
